<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PharmaMate - Add Medicine</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7f6;
}

.container {
    width: 90%;
    max-width: 650px;
    margin: 50px auto;
}

.card {
    background: white;
    padding: 35px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

h1 {
    text-align: center;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 30px;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 7px;
    font-weight: bold;
}

input, select {
    width: 100%;
    padding: 12px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 15px;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: #333;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #555;
}

.back {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #333;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>💊 Add Medicine</h1>
        <p class="subtitle">Add a new medicine to your pharmacy</p>

       <form action="addMedicine" method="post">

    <label>Medicine Name</label>
    <input type="text" name="name"
           placeholder="Enter medicine name" required>

    <label>Category</label>
    <select name="category" required>
        <option value="">Select category</option>
        <option value="Relief">Relief</option>
        <option value="Antibiotic">Antibiotic</option>
        <option value="Allergy">Allergy</option>
        <option value="Vitamin">Vitamin</option>
        <option value="Other">Other</option>
    </select>

    <label>Quantity</label>
    <input type="number" name="quantity"
           placeholder="Enter quantity" min="1" required>

    <label>Price</label>
    <input type="number" name="price"
           placeholder="Enter price" min="0" step="0.01" required>

    <label>Expiry Date</label>
    <input type="month" name="expiry" required>

    <button type="submit">Add Medicine</button>

</form>
        <a href="medicines" class="back">← Back to Medicines</a>

    </div>

</div>

</body>
</html>
