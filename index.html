<!DOCTYPE html>
<html>
<head>
    <title>PharmaMate - Login</title>

    <style>
        h1, h2, h3 {
            text-align: center;
        }

        table {
            margin: auto;
	
        }

        td {
            padding: 8px;
        }

        .login {
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>PharmaMate</h1>

    <h2>Medicine Inventory & Expiry Management System</h2>

    <h3>Login</h3>

    <form action="/PharmaMate/login" method="post">
        <table>
            <tr>
                <td><label>Enter ID:</label></td>
                <td><input type="text" name="id" placeholder="Enter your ID"></td>
            </tr>

            <tr>
                <td><label>Enter Password:</label></td>
                <td><input type="password" name="password" placeholder="Enter your password" ></td>
            </tr>
        </table>

        <br>

        <div class="login">
            <input type="submit" value="Login">
        </div>
    </form>

</body>
</html>
