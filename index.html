<!DOCTYPE html>
<html>
<head>
    <title>PharmaMate - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background: linear-gradient(135deg, #e8f5ff, #f4fbff);

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 430px;
            background: white;
            padding: 40px 45px;
            border-radius: 18px;

            box-shadow: 0 10px 35px rgba(0, 80, 120, 0.15);

            text-align: center;
        }

        .logo {
            font-size: 42px;
            margin-bottom: 5px;
        }

        h1 {
            margin: 5px 0;
            color: #075985;
            font-size: 32px;
        }

        h2 {
            margin: 8px 0 28px;
            color: #475569;
            font-size: 17px;
            font-weight: normal;
        }

        h3 {
            color: #0f172a;
            margin-bottom: 25px;
            font-size: 22px;
        }

        table {
            width: 100%;
        }

        td {
            padding: 10px 5px;
        }

        label {
            color: #334155;
            font-weight: bold;
            font-size: 14px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.12);
        }

        .login {
            margin-top: 20px;
        }

        input[type="submit"] {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;

            background: #0284c7;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        input[type="submit"]:hover {
            background: #0369a1;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">💊</div>

        <h1>PharmaMate</h1>

        <h2>
            Medicine Inventory &amp; Expiry Management System
        </h2>

        <h3>Login</h3>

        <form action="/login" method="post">

            <table>

                <tr>
                    <td>
                        <label>Enter ID:</label>
                    </td>

                    <td>
                        <input
                            type="text"
                            name="id"
                            placeholder="Enter your ID"
                        >
                    </td>
                </tr>

                <tr>
                    <td>
                        <label>Enter Password:</label>
                    </td>

                    <td>
                        <input
                            type="password"
                            name="password"
                            placeholder="Enter your password"
                        >
                    </td>
                </tr>

            </table>

            <div class="login">
                <input type="submit" value="Login">
            </div>

        </form>

        <div class="footer">
            Secure • Simple • Smart Medicine Management
        </div>

    </div>

</body>
</html>
