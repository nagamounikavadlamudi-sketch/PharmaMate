<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PharmaMate - Inventory</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f6;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 40px auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
        }

        .inventory-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #e8f3f0;
        }

        .status {
            padding: 6px 12px;
            border-radius: 15px;
        }

        .in-stock {
            background: #e8f3f0;
        }

        .low-stock {
            background: #ffe5e5;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #333;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Inventory</h1>
            <p>Track your pharmacy stock</p>
        </div>

        <div class="inventory-box">

            <table>
                <tr>
                    <th>Medicine</th>
                    <th>Available Stock</th>
                    <th>Minimum Stock</th>
                    <th>Status</th>
                </tr>

                <!-- Database medicines will be displayed by InventoryServlet -->

            </table>

        </div>

        <a href="dashboard.html" class="back">
             Back to Dashboard
        </a>

    </div>

</body>
</html>
