<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PharmaMate - Medicines</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f7f6;
    padding: 40px;
    margin: 0;
}

.container {
    width: 90%;
    max-width: 1100px;
    margin: auto;
}

h1 {
    text-align: center;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #555;
    margin-bottom: 30px;
}

.search-box {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 25px;
    display: flex;
    gap: 12px;
}

.search-box input {
    flex: 1;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
}

.search-box button {
    padding: 12px 25px;
    background: #333;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
}

.table-box {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 12px #ccc;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 14px;
    border: 1px solid #ddd;
    text-align: center;
}

th {
    background: #d8e3e6;
}

.add-btn {
    display: block;
    width: fit-content;
    margin: 25px auto;
    padding: 12px 25px;
    background: #333;
    color: white;
    text-decoration: none;
    border-radius: 8px;
}

.add-btn:hover {
    background: #555;
}

.back {
    display: block;
    text-align: center;
    color: #333;
    text-decoration: none;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

<h1>Medicines</h1>

<p class="subtitle">
Manage your pharmacy medicines
</p>

<div class="search-box">

<input
    type="text"
    id="searchInput"
    placeholder="Search medicine..."
    onkeyup="searchMedicine()">

<button onclick="searchMedicine()">
Search
</button>

</div>

<div class="table-box">

<table id="medicineTable">

<thead>
<tr>
    <th>Medicine Name</th>
    <th>Category</th>
    <th>Quantity</th>
    <th>Price</th>
    <th>Expiry Date</th>
</tr>
</thead>

<tbody>

<tr>
    <td>Dolo 650</td>
    <td>Relief</td>
    <td>100</td>
    <td>53.0</td>
    <td>2027-12</td>
</tr>

<tr>
    <td>Paracetamol</td>
    <td>Relief</td>
    <td>50</td>
    <td>25.0</td>
    <td>2028-06</td>
</tr>

<tr>
    <td>Amoxicillin</td>
    <td>Antibiotic</td>
    <td>50</td>
    <td>85.0</td>
    <td>2028-06</td>
</tr>

</tbody>

</table>

</div>

<a href="add-medicine.html" class="add-btn">
+ Add Medicine
</a>

<a href="dashboard.html" class="back">
&larr; Back to Dashboard
</a>

</div>

<script>

function searchMedicine() {

    let input = document
        .getElementById("searchInput")
        .value
        .toLowerCase();

    let rows = document
        .getElementById("medicineTable")
        .getElementsByTagName("tbody")[0]
        .getElementsByTagName("tr");

    for (let i = 0; i < rows.length; i++) {

        let name = rows[i]
            .getElementsByTagName("td")[0]
            .innerText
            .toLowerCase();

        if (name.includes(input)) {
            rows[i].style.display = "";
        } else {
            rows[i].style.display = "none";
        }
    }
}

</script>

</body>
</html>
