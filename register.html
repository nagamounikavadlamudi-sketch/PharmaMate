<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PharmaMate - Register</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8f5ff, #f4fbff);

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 430px;
            background: white;
            padding: 40px 45px;
            border-radius: 18px;

            box-shadow: 0 10px 35px rgba(0, 80, 120, 0.15);

            text-align: center;
        }

        h1 {
            margin: 5px 0;
            color: #075985;
            font-size: 32px;
        }

        h2 {
            margin: 8px 0 28px;
            color: #475569;
            font-size: 17px;
            font-weight: normal;
        }

        h3 {
            color: #0f172a;
            margin-bottom: 25px;
            font-size: 22px;
        }

        table {
            width: 100%;
        }

        td {
            padding: 10px 5px;
        }

        label {
            color: #334155;
            font-weight: bold;
            font-size: 14px;
        }

        input[type="email"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        input[type="email"]:focus {
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.12);
        }

        .otp-button {
            margin-top: 20px;
        }

        input[type="submit"] {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;

            background: #0284c7;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        input[type="submit"]:hover {
            background: #0369a1;
        }

        .back-login {
            margin-top: 20px;
            font-size: 14px;
            color: #64748b;
        }

        .back-login a {
            color: #0284c7;
            font-weight: bold;
            text-decoration: none;
        }

        .back-login a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>PharmaMate</h1>

        <h2>Medicine Inventory &amp; Expiry Management System</h2>

        <h3>Create Your Account</h3>

        <form action="sendOTP" method="post">

            <table>

                <tr>
                    <td>
                        <label>Enter Email:</label>
                    </td>

                    <td>
                        <input
                            type="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >
                    </td>
                </tr>

            </table>

            <div class="otp-button">
                <input type="submit" value="Send OTP">
            </div>

        </form>

        <div class="back-login">
            Already have an account?
            <a href="index.html">Login here</a>
        </div>

    </div>

</body>
</html>
