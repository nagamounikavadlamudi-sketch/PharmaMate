<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - PharmaMate</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 5px;
        }
        h3 {
            color: #666;
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: normal;
        }
        h2 {
            color: #444;
            margin-bottom: 20px;
        }
        form {
            display: flex;
            flex-direction: column;
            text-align: left;
        }
        label {
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input[type="email"],
        input[type="text"],
        input[type="password"] {
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            background-color: #4a76a8;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover {
            background-color: #3b5f87;
        }
        a {
            display: inline-block;
            margin-top: 15px;
            color: #4a76a8;
            text-decoration: none;
            font-size: 14px;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>PharmaMate</h1>
        <h3>Medicine Inventory & Expiry Management System</h3>
        
        <form action="registerAccount" method="POST">
            <h2>Create Your Account</h2>
            
            <label>Enter Email:</label>
            <input type="email" name="userEmail" placeholder="Enter your email" required>
            
            <label>Choose a Username:</label>
            <input type="text" name="username" placeholder="Enter username" required>
            
            <label>Create a Password:</label>
            <input type="password" name="password" placeholder="Enter password" required>
            
            <button type="submit">Create Account</button>
        </form>
        
        <!-- Changed login.html to index.html -->
        <a href="index.html">Already have an account? Login here</a>
    </div>

</body>
</html>
