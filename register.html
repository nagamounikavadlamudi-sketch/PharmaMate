<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaMate - Register</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #e5e7eb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .register-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 35px 30px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .icon {
            font-size: 32px;
            margin-bottom: 5px;
            display: inline-block;
        }

        h1 {
            font-size: 24px;
            color: #1f2937;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 11px;
            color: #4b5563;
            line-height: 1.4;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 18px;
            color: #111827;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .input-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .input-group label {
            font-size: 13px;
            font-weight: 700;
            color: #111827;
            text-align: left;
            width: 38%;
        }

        .input-group input {
            width: 60%;
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            color: #374151;
            background-color: #f9fafb;
        }

        .input-group input:focus {
            border-color: #2563eb;
            background-color: #ffffff;
        }

        .btn-register {
            width: 100%;
            padding: 10px;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            margin-bottom: 18px;
            transition: background-color 0.2s ease;
        }

        .btn-register:hover {
            background-color: #1d4ed8;
        }

        .footer-link {
            font-size: 12px;
            color: #4b5563;
        }

        .footer-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }

        .tagline {
            font-size: 10px;
            color: #6b7280;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="register-card">
        <div class="icon">💊</div>
        <h1>PharmaMate</h1>
        <p class="subtitle">Medicine Inventory & Expiry Management<br>System</p>
        
        <h2>Create Your Account</h2>

        <form action="RegisterServlet" method="POST">
            <div class="input-group">
                <label for="userId">Enter ID:</label>
                <input type="text" id="userId" name="userId" placeholder="Enter your ID" required>
            </div>

            <div class="input-group">
                <label for="password">Enter Password:</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn-register">Register</button>
        </form>

        <p class="footer-link">
            Already have an account? <a href="login.html">Login here</a>
        </p>

        <p class="tagline">Secure • Simple • Smart Medicine Management</p>
    </div>

</body>
</html>
